name: RaceDay API CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore RaceDayAPI/RaceDayAPI.csproj
      - name: Build API
        run: dotnet build RaceDayAPI/RaceDayAPI.csproj --configuration Release --no-restore
      - name: Verify SQL files are present
        run: test -f "PROG SQL QUERY 1.sql" && test -f "PROG SQL QUERY 2 TESTING.sql"
